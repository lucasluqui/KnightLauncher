m.scene_editor_legacy_warning="No uses este Editor de escenas legacy para crear contenido que pienses enviar al programa Crucible del Coliseo.\nEn su lugar, usa el Editor de Crucible al que puedes acceder desde el juego.\n\nEste editor legacy podría dejar de funcionar en cualquier momento y no se garantiza su soporte en el futuro.\n\n¿Deseas continuar?"
m.crucible_editor_warning="El Editor de Crucible es mantenido exclusivamente por Grey Havens, y este launcher no tiene respaldo ni asociación alguna.\nEsto es simplemente un acceso directo al mismo editor al que accederías desde el juego.\n\nUsar el Editor de Crucible fuera del juego no está soportado oficialmente...\nLas cosas pueden funcionar o no correctamente, úsalo bajo tu propio criterio.\n\nCualquier creación que hagas debe cumplir con los Términos de Servicio del Coliseum Crucible:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nAsegúrate de que cualquier error que quieras reportar pueda reproducirse iniciando el editor desde el juego.\n\n¿Deseas continuar?"
m.scheduled_maintenance_warning="Los servidores del juego se encuentran actualmente en una ventana de mantenimiento.\nTu sesión de juego puede sufrir interrupciones, o puede que no puedas iniciar sesión en absoluto.\n\nEl mantenimiento termina a las: {0}. (mostrado en tu hora local)\n\nLa hora indicada es una estimación oficial, pero siempre podría variar.\nPor favor revisa los foros del juego para más información."
m.invalid_additional_args_warning="Uno o más argumentos JVM en tu ajuste de Argumentos adicionales (Extra.txt) son inválidos.\n\nPor favor ve a Ajustes → Avanzado y revísalos. Consulta los logs de Knight Launcher para más información.\n\nTodos ellos serán ignorados en este inicio."
