# Error messages
error.invalid_dir="Musisz umieścić ten plik .jar w głównym folderze Spiral Knights. {0}"
error.game_launch="Nie udało się uruchomić gry.\n\nZalecamy wypróbowanie poniższych rozwiązań w dowolnej kolejności:\n- W zakładce \"Gra\" w ustawieniach launchera naciśnij przycisk \"Wczytaj zalecane ustawienia\".\n- Zmniejsz przydzieloną pamięć w zakładce \"Gra\" w ustawieniach launchera.\n- W zakładce \"Gra\" w ustawieniach launchera naciśnij przycisk \"Przywróć wartości domyślne\".\n- Zainstaluj inną Java VM w zakładce \"Gra\" w ustawieniach launchera.\n\nJeśli to nie rozwiąże problemu, możesz poprosić o pomoc techniczną na Discordzie.\n\nProsząc o pomoc na Discordzie, załącz WSZYSTKIE swoje pliki logów.\nWSZYSTKIE logi możesz skopiować automatycznie w Ustawienia → O nas → Skopiuj logi do schowka, a następnie wkleić je na Discordzie za pomocą CTRL + V."
error.start_location="Wygląda na to, że plik .jar znajduje się w niewłaściwym folderze.\nCzasami jest to fałszywy alarm i można go zignorować. Knight Launcher spróbuje uruchomić się normalnie.\nJeśli problem będzie się powtarzał, użyj pliku Batch (KnightLauncher_windows.bat) w systemie Windows\nlub pliku Shell (KnightLauncher_mac_linux.sh) w systemie OSX/Linux."
error.start_location_steam_path="\nDodatkowo wykryliśmy następującą ścieżkę Steam: \n{0}"
error.flamingo_offline="Nie udało się połączyć z Flamingo.\nNiektóre funkcje launchera mogą być niedostępne."
error.no_compatible_jvm="Brak zgodnej Java VM do uruchomienia edytora."
error.folders_within_mods_folder="W folderze modyfikacji znajdują się foldery.\nNie musisz rozpakowywać pliku .zip, po prostu przeciągnij i upuść plik .zip do folderu modyfikacji."
error.unsupported_64bit="Twój system nie obsługuje łatania 64-bitowej Java VM."
error.not_supported="Nieobsługiwane."
error.launcher_already_running="Knight Launcher jest już uruchomiony.\nPoszukaj go na pasku zadań lub w zasobniku systemowym."
error.game_already_running="Spiral Knights jest już uruchomione.\nZamknij grę przed otwarciem Knight Launcher."
error.game_already_running_launch="Spiral Knights jest już uruchomione.\nAby uruchomić kolejnego klienta, przytrzymaj klawisz ALT (OPTION na macOS) lub SHIFT podczas naciskania Graj, aby uruchomić grę w trybie Alt."
error.mod_file_format="Obsługiwane są tylko pliki z rozszerzeniem .zip, .jar i .modpack, spróbuj ponownie."
error.incompatible_mod="Znaleziono co najmniej jedną niezgodną modyfikację. Wszystkie niezgodne modyfikacje zostaną automatycznie wyłączone.\nZaktualizuj je, aby przywrócić ich działanie."

