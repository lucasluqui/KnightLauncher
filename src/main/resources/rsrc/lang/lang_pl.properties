m.scene_editor_legacy_warning="Nie używaj tego starego Edytora scen do tworzenia treści, które zamierzasz zgłosić do programu Crucible w Koloseum.\nZamiast tego użyj Edytora Crucible dostępnego w grze.\n\nTen stary edytor może w każdej chwili przestać działać, a jego dalsze wsparcie nie jest gwarantowane.\n\nCzy chcesz kontynuować?"
m.crucible_editor_warning="Edytor Crucible jest utrzymywany wyłącznie przez Grey Havens, a ten launcher nie jest przez nich wspierany ani z nimi powiązany.\nTo jedynie skrót do tego samego edytora, który otwierasz w grze.\n\nKorzystanie z Edytora Crucible poza grą nie jest oficjalnie wspierane...\nNie wszystko musi działać poprawnie, używasz go na własną odpowiedzialność.\n\nWszystkie Twoje dzieła muszą być zgodne z Warunkami korzystania z Coliseum Crucible:\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\nUpewnij się, że błędy, które chcesz zgłosić, występują również po uruchomieniu edytora z gry.\n\nCzy chcesz kontynuować?"
m.scheduled_maintenance_warning="Serwery gry są obecnie w trakcie przerwy technicznej.\nTwoja sesja gry może zostać przerwana lub logowanie może być całkowicie niemożliwe.\n\nPrzerwa techniczna kończy się o: {0}. (w Twoim czasie lokalnym)\n\nPowyższa godzina jest oficjalnym szacunkiem, ale zawsze może się zmienić.\nWięcej informacji znajdziesz na forum gry."
m.invalid_additional_args_warning="Jeden lub więcej argumentów JVM w ustawieniu Dodatkowe argumenty (Extra.txt) jest nieprawidłowy.\n\nPrzejdź do Ustawienia → Zaawansowane i sprawdź je. Więcej informacji znajdziesz w logach Knight Launcher.\n\nWszystkie zostaną pominięte przy tym uruchomieniu."
m.invalid_additional_args_save_warning="Jeden lub więcej argumentów JVM w ustawieniu Dodatkowe argumenty (Extra.txt) jest nieprawidłowy i zostały one przywrócone do wartości domyślnych.\n\nPrzejdź do Ustawienia → Zaawansowane i sprawdź je. Więcej informacji znajdziesz w logach Knight Launcher."

