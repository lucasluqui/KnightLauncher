m.scene_editor_legacy_warning="請勿使用此舊版場景編輯器製作你打算提交至競技場 Crucible 計畫的內容。\n請改用遊戲內可存取的 Crucible 編輯器。\n\n此舊版編輯器可能隨時失效，且不保證未來的支援。\n\n是否繼續？"
m.crucible_editor_warning="Crucible 編輯器由 Grey Havens 獨家維護，本啟動器未獲得其認可，也與其無任何關聯。\n這只是存取與遊戲內相同編輯器的捷徑。\n\n在遊戲外使用 Crucible 編輯器不受官方支援...\n功能可能無法正常運作，請自行斟酌使用。\n\n你創作的任何內容都必須遵守 Coliseum Crucible 服務條款：\nhttps://wiki.spiralknights.com/Coliseum_Crucible_Terms_and_Conditions\n\n請確保你打算回報的任何問題都能在遊戲內啟動編輯器時重現。\n\n是否繼續？"
m.scheduled_maintenance_warning="遊戲伺服器目前正處於維護時段。\n你的遊戲階段可能會中斷，或可能完全無法登入。\n\n維護結束時間：{0}。（以你的當地時間顯示）\n\n以上時間為官方估計，可能會有變動。\n請查看遊戲論壇以了解更多資訊。"
m.invalid_additional_args_warning="你的附加參數（Extra.txt）設定中有一個或多個 JVM 參數無效。\n\n請前往 設定 → 進階 檢查它們。查看 Knight Launcher 日誌以了解更多資訊。\n\n本次啟動將忽略所有這些參數。"
m.invalid_additional_args_save_warning="你的附加參數（Extra.txt）設定中有一個或多個 JVM 參數無效，已被強制重設為預設值。\n\n請前往 設定 → 進階 檢查它們。查看 Knight Launcher 日誌以了解更多資訊。"

